<script>/* Thread Height Solver 1.0 — pure deterministic geometry core; lengths in mm.
   Fixed world-axis model only. This is not a torque, sealing, or fire-code model. */
(function(root){
'use strict';
const EPS=1e-8, MAX_INTERVALS=12000, MAX_PRODUCTS=800000;
class ModelError extends Error { constructor(message,kind='invalid'){super(message);this.kind=kind;} }
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const dir=d=>({down:1,up:-1,horizontal:0}[d]);
const finite=x=>typeof x==='number'&&Number.isFinite(x);
function validate(s){
 const e=[];
 for(const k of ['reference','target','tolerance','uncertainty']) if(!finite(s[k])) e.push('請填寫完整的尺寸與誤差數值。');
 if(s.reference<=0||s.target<=0) e.push('基準下垂距離與目標距離必須大於 0。');
 if(s.tolerance<0||s.uncertainty<0)e.push('允許誤差與不確定量不能小於 0。');
 if(!['adjustable','uncertain'].includes(s.strategy))e.push('求解方式無效。');
 if(!s.joints||s.joints.length<1||s.joints.length>12)e.push('請使用 1～12 個接點。');
 for(const [i,j] of (s.joints||[]).entries()){
  const n=j.name||('接點 '+(i+1));
  if(!['down','up','horizontal'].includes(j.axis))e.push(n+'：軸向無效。');
  if(!['continuous','phase','fixed'].includes(j.mode))e.push(n+'：限制模式無效。');
  for(const k of ['pitch','min','max','ref','phase','fixed'])if(!finite(j[k]))e.push(n+'：數值未填完整。');
  if(j.pitch<=0||j.pitch>100)e.push(n+'：導程須大於 0 且不超過 100 mm／圈。');
  if(j.min>j.max)e.push(n+'：下限不可大於上限。');
  if(j.max-j.min>60)e.push(n+'：此版每個接點最多分析 60 圈寬的範圍。');
  if(Math.abs(j.min)>10000||Math.abs(j.max)>10000||Math.abs(j.ref)>10000)e.push(n+'：圈數過大，請重新定義零位。');
 }
 const l=s.length;
 if(!l)e.push('缺少改管長資料。'); else {
  for(const k of ['original','trial','min','max','step']) if(!finite(l[k]))e.push('改管長欄位未填完整。');
  if(l.original<=0||l.trial<=0||l.min<=0||l.max<l.min||l.step<=0)e.push('管長與步距須大於 0，且管長上限不可小於下限。');
  if(!['down','up','horizontal'].includes(l.axis))e.push('改管段的軸向無效。');
 }
 if(e.length)throw new ModelError([...new Set(e)].join('\n'));
}
function merge(intervals){
 if(!intervals.length)return [];
 intervals.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
 const out=[];let cur=intervals[0].slice();
 for(let i=1;i<intervals.length;i++){
  const v=intervals[i];
  if(v[0]<=cur[1]+EPS)cur[1]=Math.max(cur[1],v[1]);
  else {out.push(cur);cur=v.slice();}
 }
 out.push(cur);
 if(out.length>MAX_INTERVALS)throw new ModelError('離散高度區間超過此版運算上限；尚未完成判斷。請減少相位接點或縮小圈數範圍。','complexity');
 return out;
}
function convolve(a,b){
 if(a.length*b.length>MAX_PRODUCTS)throw new ModelError('方向組合過多；尚未完成判斷。請拆分固定部分，或縮小允許圈數。','complexity');
 const r=[];for(const x of a)for(const y of b)r.push([x[0]+y[0],x[1]+y[1]]);return merge(r);
}
function domain(j,margin=0){
 const w=j.max-j.min;
 const lo=j.mode==='fixed'?j.min:j.min+w*margin;
 const hi=j.mode==='fixed'?j.max:j.max-w*margin;
 const a=-dir(j.axis)*j.pitch;
 const contribution=n=>a*(n-j.ref);
 if(j.mode==='continuous'){
  if(lo>hi+EPS)return {j,values:[],intervals:[],a,lo,hi};
  return {j,values:null,intervals:[[Math.min(contribution(lo),contribution(hi)),Math.max(contribution(lo),contribution(hi))]],a,lo,hi};
 }
 let values=[];
 if(j.mode==='fixed'){
  if(j.fixed>=lo-EPS&&j.fixed<=hi+EPS)values=[j.fixed];
 } else {
  const phase=((j.phase%1)+1)%1;
  const k0=Math.ceil(lo-phase-EPS),k1=Math.floor(hi-phase+EPS);
  for(let k=k0;k<=k1;k++)values.push(phase+k);
 }
 return {j,values,intervals:merge(values.map(n=>[contribution(n),contribution(n)])),a,lo,hi};
}
function build(joints,margin=0){
 const domains=joints.map(j=>domain(j,margin));
 const suffix=Array(domains.length+1);suffix[domains.length]=[[0,0]];
 for(let i=domains.length-1;i>=0;i--)suffix[i]=convolve(domains[i].intervals,suffix[i+1]);
 return {domains,suffix,intervals:suffix[0]};
}
function intersects(intervals,lo,hi){return intervals.some(v=>v[1]>=lo-EPS&&v[0]<=hi+EPS);}
function nearest(intervals,value,lo=-Infinity,hi=Infinity){
 let best=null,dist=Infinity;
 for(const [a,b] of intervals){const l=Math.max(a,lo),h=Math.min(b,hi);if(l>h+EPS)continue;
  const n=clamp(value,l,h),d=Math.abs(n-value);if(d<dist){best=n;dist=d;}}
 return best;
}
function reconstruct(b,total){
 const out=[];let remain=total;
 for(let i=0;i<b.domains.length;i++){
  const d=b.domains[i],mid=(d.j.min+d.j.max)/2;let best=null,bestDist=Infinity;
  const consider=n=>{const val=d.a*(n-d.j.ref),delta=Math.abs(n-mid);if(delta<bestDist){best=n;bestDist=delta;}};
  if(d.values){for(const n of d.values){const val=d.a*(n-d.j.ref);if(intersects(b.suffix[i+1],remain-val,remain-val))consider(n);}}
  else if(Math.abs(d.a)<EPS){if(intersects(b.suffix[i+1],remain,remain))consider(clamp(mid,d.lo,d.hi));}
  else {
   for(const [sl,sh] of b.suffix[i+1]){
    const v0=(remain-sh)/d.a+d.j.ref,v1=(remain-sl)/d.a+d.j.ref;
    const lo=Math.max(d.lo,Math.min(v0,v1)),hi=Math.min(d.hi,Math.max(v0,v1));
    if(lo<=hi+EPS)consider(clamp(mid,lo,hi));
   }
  }
  if(best===null)throw new ModelError('數值重建失敗，未輸出裝配方案。請放寬極小容差後重試。','numeric');
  out.push(best);remain-=d.a*(best-d.j.ref);
 }
 if(Math.abs(remain)>1e-5)throw new ModelError('數值殘差過大，未輸出裝配方案。','numeric');
 return out;
}
function contribution(j,n){return -dir(j.axis)*j.pitch*(n-j.ref);}
function base(s,L=s.length.trial){return s.reference+dir(s.length.axis)*(L-s.length.original);}
function position(s,turns,L=s.length.trial){return base(s,L)+s.joints.reduce((a,j,i)=>a+contribution(j,turns[i]),0);}
function minMargin(joints,turns){
 let m=.5,has=false;
 joints.forEach((j,i)=>{if(j.mode!=='fixed'&&j.max>j.min+EPS){has=true;m=Math.min(m,(turns[i]-j.min)/(j.max-j.min),(j.max-turns[i])/(j.max-j.min));}});
 return has?Math.max(0,m):null;
}
function optimize(s,L,b0,lo,hi){
 const B=base(s,L);let l=lo-B,h=hi-B;
 if(!intersects(b0.intervals,l,h))return null;
 let exact=nearest(b0.intervals,s.target-B,l,h);
 if(s.objective==='center'){l=exact;h=exact;}
 let low=0,high=.5;
 // Monotonic feasibility: shrinking every free domain cannot create a new solution.
 for(let k=0;k<34;k++){const m=(low+high)/2,b=build(s.joints,m);if(intersects(b.intervals,l,h))low=m;else high=m;}
 const b=build(s.joints,Math.max(0,low-1e-8));
 exact=nearest(b.intervals,s.target-B,l,h);
 if(exact===null)throw new ModelError('餘量搜尋未能穩定收斂；未輸出圈數。','numeric');
 const turns=reconstruct(b,exact),D=position(s,turns,L);
 return {turns,D,error:D-s.target,margin:minMargin(s.joints,turns),L,range:[D-s.uncertainty,D+s.uncertainty],guaranteed:D-s.uncertainty>=s.target-s.tolerance-EPS&&D+s.uncertainty<=s.target+s.tolerance+EPS};
}
function solve(s,L=s.length.trial,provided=null){
 validate(s);const b=provided||build(s.joints),B=base(s,L);
 const empty=b.domains.map((d,i)=>d.intervals.length?null:i).filter(x=>x!==null);
 if(empty.length)return {kind:'domain-empty',empty,intervals:[],b};
 const intervals=b.intervals.map(v=>[v[0]+B,v[1]+B]);
 const min=intervals[0][0],max=intervals[intervals.length-1][1];
 if(min<=0)throw new ModelError('模型包含灑水頭到達固定基準上方的狀態（D ≤ 0）。請檢查基準、方向或允許範圍。');
 const low=s.target-s.tolerance,high=s.target+s.tolerance;
 const range=[min-s.uncertainty,max+s.uncertainty];
 const guarantee=range[0]>=low-EPS&&range[1]<=high+EPS;
 if(s.strategy==='uncertain')return {kind:guarantee?'robust':'not-robust',intervals,min,max,range,guarantee,b,requiredTolerance:(max-min)/2+s.uncertainty};
 const candidate=optimize(s,L,b,low,high);
 if(candidate)return {kind:'feasible',candidate,intervals,min,max,range,b};
 const closest=nearest(b.intervals,s.target-B)+B;
 const close=optimize(s,L,b,closest,closest);
 return {kind:'infeasible',reason:s.target>=min-EPS&&s.target<=max+EPS?'gap':'outside',closest:close,intervals,min,max,range,b};
}
function lengthAdvice(s,result){
 const q=dir(s.length.axis),l=s.length;
 if(!q)return {kind:'horizontal',ranges:[],suggestions:[]};
 if(result.kind==='domain-empty')return {kind:'domain-empty',ranges:[],suggestions:[]};
 const b=result.b||build(s.joints);if(!b.intervals.length)return {kind:'domain-empty',ranges:[],suggestions:[]};
 let ranges=[];
 if(s.strategy==='uncertain'){
  const mn=s.reference+b.intervals[0][0]-s.uncertainty,mx=s.reference+b.intervals[b.intervals.length-1][1]+s.uncertainty;
  const low=s.target-s.tolerance-mn,high=s.target+s.tolerance-mx;
  if(low>high+EPS)return {kind:'width',ranges:[],suggestions:[],requiredTolerance:(mx-mn)/2};
  ranges=[[l.original+Math.min(low/q,high/q),l.original+Math.max(low/q,high/q)]];
 } else {
  ranges=b.intervals.map(([a,z])=>{const low=(s.target-s.tolerance-s.reference-z)/q,high=(s.target+s.tolerance-s.reference-a)/q;return [l.original+Math.min(low,high),l.original+Math.max(low,high)];});
 }
 ranges=merge(ranges.map(([a,z])=>[Math.max(l.min,a),Math.min(l.max,z)]).filter(([a,z])=>a<=z+EPS));
 if(!ranges.length)return {kind:'out-of-bounds',ranges:[],suggestions:[]};
 const midTurns=b.domains.map(d=>d.values?d.values.reduce((a,z)=>Math.abs(z-(d.j.min+d.j.max)/2)<Math.abs(a-(d.j.min+d.j.max)/2)?z:a):((d.lo+d.hi)/2));
 const centerD=position(s,midTurns,l.original),ideal=l.original+(s.target-centerD)/q;
 const values=new Set();
 for(const [a,z] of ranges){const k0=Math.ceil(a/l.step-EPS),k1=Math.floor(z/l.step+EPS);if(k0>k1)continue;
  const add=k=>values.add(Number((clamp(k,k0,k1)*l.step).toFixed(9)));
  [ideal,l.original,l.trial,(a+z)/2].forEach(v=>{add(Math.floor(v/l.step));add(Math.ceil(v/l.step));});add(k0);add(k1);
 }
 if(!values.size)return {kind:'grid',ranges,suggestions:[]};
 // The reachable ranges are exact. Recommendation rows are representative, not exhaustive.
 const candidates=[...values].sort((a,z)=>Math.abs(a-ideal)-Math.abs(z-ideal)||Math.abs(a-l.original)-Math.abs(z-l.original)).slice(0,10);
 const suggestions=[];
 for(const L of candidates){const r=solve(s,L,b);if(r.kind==='feasible')suggestions.push({...r.candidate,delta:L-l.original});else if(r.kind==='robust')suggestions.push({L,delta:L-l.original,D:(r.range[0]+r.range[1])/2,range:r.range,error:(r.range[0]+r.range[1])/2-s.target,margin:null});}
 suggestions.sort((a,z)=>(z.margin??0)-(a.margin??0)||Math.abs(a.error)-Math.abs(z.error)||Math.abs(a.delta)-Math.abs(z.delta));
 return {kind:'ok',ranges,suggestions:suggestions.slice(0,3),ideal};
}
root.ThreadEngine={EPS,ModelError,clamp,dir,validate,merge,domain,build,base,contribution,position,minMargin,solve,lengthAdvice};
if(typeof module!=='undefined'&&module.exports)module.exports=root.ThreadEngine;
})(typeof window!=='undefined'?window:globalThis);
</script>
<script>(function(root){
'use strict';
const E=root.ThreadEngine||(typeof require!=='undefined'?require('./engine.js'):null);
const clone=o=>JSON.parse(JSON.stringify(o));
function fixture(){const j={name:'接點',pitch:2,min:1,max:2,ref:0,axis:'down',mode:'continuous',phase:1.25,fixed:1.5};return {reference:300,target:294,tolerance:.5,uncertainty:0,strategy:'adjustable',objective:'margin',joints:[{...j},{...j}],length:{original:200,trial:200,min:100,max:350,step:1,axis:'down'}};}
function run(){const tests=[],assert=(x,m='條件不成立')=>{if(!x)throw new Error(m);},near=(a,b,tol=1e-5)=>assert(Math.abs(a-b)<=tol,`${a} ≠ ${b}`),test=(name,fn)=>{try{fn();tests.push({name,pass:true});}catch(e){tests.push({name,pass:false,error:e.message});}};
 test('直管可達範圍 292～296 mm',()=>{const r=E.solve(fixture());near(r.min,292);near(r.max,296);assert(r.kind==='feasible');});
 test('中點解：兩處各 1.5 圈，到達 294 mm',()=>{const c=E.solve(fixture()).candidate;c.turns.forEach(n=>near(n,1.5));near(c.D,294);near(c.margin,.5);});
 test('目標 298 mm：原管長無解',()=>{const s=fixture();s.target=298;const r=E.solve(s);assert(r.kind==='infeasible');near(r.closest.D,296);assert(r.reason==='outside');});
 test('反推長度：原 200 改為 204 mm',()=>{const s=fixture();s.target=298;const a=E.lengthAdvice(s,E.solve(s));assert(a.kind==='ok');near(a.suggestions[0].L,204);near(a.suggestions[0].D,298);});
 test('相位限定只能選 1.25、2.25 圈',()=>{const j=fixture().joints[0];j.mode='phase';j.max=2.5;assert(JSON.stringify(E.domain(j).values)==='[1.25,2.25]');});
 test('離散高度空隙不能誤判為有解',()=>{const s=fixture();s.tolerance=.1;s.joints[0].mode='phase';s.joints[0].max=2.5;s.joints[1].mode='fixed';s.joints[1].fixed=1.25;const r=E.solve(s);assert(r.kind==='infeasible');assert(r.reason==='gap');assert(r.intervals.length===2);near(r.min,293);near(r.max,295);});
 test('固定值超出允許範圍：無允許裝配狀態',()=>{const s=fixture();s.joints[0].mode='fixed';s.joints[0].fixed=3;assert(E.solve(s).kind==='domain-empty');});
 test('相位與允許範圍無交集',()=>{const s=fixture();Object.assign(s.joints[0],{mode:'phase',min:1.4,max:1.6,phase:1.25});assert(E.solve(s).kind==='domain-empty');});
 test('水平接點不改變高度，但仍須符合相位',()=>{const s=fixture();Object.assign(s.joints[0],{axis:'horizontal',mode:'phase',phase:1.25});s.target=297;const r=E.solve(s);near(r.min,296);near(r.max,298);near(r.candidate.turns[0],1.25);});
 test('向上接點的高度貢獻符號相反',()=>{const s=fixture();s.joints[0].axis='up';s.target=300;const r=E.solve(s);near(r.min,298);near(r.max,302);near(r.candidate.D,300);});
 test('基準圈數非零時，不重複扣吃入量',()=>{const s=fixture();s.joints.forEach(j=>j.ref=1.5);s.target=300;const r=E.solve(s);near(r.min,298);near(r.max,302);near(r.candidate.D,300);});
 test('額外誤差超出容差：名義可行但不可保證',()=>{const s=fixture();s.uncertainty=1;const r=E.solve(s);assert(r.kind==='feasible');assert(!r.candidate.guaranteed);});
 test('最終圈數不確定：全部狀態不能達標',()=>{const s=fixture();s.strategy='uncertain';s.uncertainty=.2;const r=E.solve(s);assert(r.kind==='not-robust');near(r.range[0],291.8);near(r.range[1],296.2);near(r.requiredTolerance,2.2);});
 test('範圍太寬時，改管長不能消除不確定性',()=>{const s=fixture();s.strategy='uncertain';const a=E.lengthAdvice(s,E.solve(s));assert(a.kind==='width');near(a.requiredTolerance,2);});
 test('容差完整涵蓋所有最終狀態',()=>{const s=fixture();s.strategy='uncertain';s.tolerance=2;assert(E.solve(s).kind==='robust');});
 test('不確定模式可反推整體平移管長',()=>{const s=fixture();s.strategy='uncertain';s.tolerance=2.1;s.target=298;const a=E.lengthAdvice(s,E.solve(s));assert(a.kind==='ok');near(a.suggestions[0].L,204);});
 test('改向上管段：加長會讓末端上移',()=>{const s=fixture();s.length.axis='up';s.length.trial=204;s.target=290;near(E.solve(s).candidate.D,290);});
 test('改水平管長不提供高度補償',()=>{const s=fixture();s.length.axis='horizontal';const a=E.lengthAdvice(s,E.solve(s));assert(a.kind==='horizontal');});
 test('連續長度有解但選料步距未命中',()=>{const s=fixture();s.joints.forEach(j=>Object.assign(j,{mode:'fixed',fixed:1.5}));s.target=294.5;s.tolerance=.01;const a=E.lengthAdvice(s,E.solve(s));assert(a.kind==='grid');});
 test('零容差也能重建精確尺寸解',()=>{const s=fixture();s.target=294.3;s.tolerance=0;const r=E.solve(s);assert(r.kind==='feasible');near(r.candidate.D,294.3,1e-6);});

function patchPreserving(oldRoot,newRoot,id){
 const children=[...newRoot.children],oldKeep=[...oldRoot.children].find(n=>n.id===id||n.querySelector('#'+id)),newKeep=children.find(n=>n.id===id||n.querySelector('#'+id));
 if(!oldKeep||!newKeep){oldRoot.innerHTML=newRoot.innerHTML;return;}
 const oldAt=oldKeep.id===id,newAt=newKeep.id===id;
 if(oldAt!==newAt){oldRoot.innerHTML=newRoot.innerHTML;return;}
 for(const n of [...oldRoot.childNodes])if(n!==oldKeep)n.remove();
 let after=false;
 for(const n of children){if(n===newKeep){after=true;continue;}if(after)oldRoot.append(n);else oldRoot.insertBefore(n,oldKeep);}
 if(!oldAt){oldKeep.className=newKeep.className;patchPreserving(oldKeep,newKeep,id);}
}

muted">圈</span><button class="btn" data-nudge="${i}" data-sign="1" aria-label="增加${esc(j.name)}模擬圈數">+</button></div>`}<div class="manual-info" id="manual-info-${i}"></div></div>`;}).join('')}<div class="callout" style="margin-top:17px">不能把任意圈數當成合格鎖法，也不要以退牙遷就高度。此處只模擬你已提供的允許範圍。</div></div></div>`;
 updateManual();
}
function updateManual(){
 const ns=valuesForManual(),ok=!currentError&&ns.every(Number.isFinite),D=ok?E.position(s,ns):NaN,diff=D-s.target,inside=ok&&Math.abs(diff)<=s.tolerance+1e-7;
 if(!$('#manual-stats'))return;
 $('#manual-stats').innerHTML=`<div class="result-state ${inside?'':'warn'}">${icon(inside?'check':'info')} ${!ok?'請先修正接頭／尺寸限制':inside?'此模擬在目標誤差內':`目前${diff>0?'偏低':'偏高'} ${unitDim(Math.abs(diff))}`}</div><div class="result-big num">${dim(D)}<span class="unit">${U()}</span></div><p class="help">目標 ${unitDim(s.target)} ± ${unitDim(s.tolerance)}${s.strategy==='uncertain'?'；單一模擬命中，不等於所有狀態都能達標。':''}</p>`;
 $('#manual-drawing').innerHTML=diagram(D,ns,true);
 if(ok){const span=Math.max(Math.abs(diff)*1.3,s.tolerance*2,1),px=v=>215+v/span*166;$('#manual-zoom').innerHTML=`<svg viewBox="0 0 430 105" class="range-svg" role="img" aria-label="對位差 ${esc(unitDim(diff))}"><path d="M40 58H390" stroke="#dce4df" stroke-width="7" stroke-linecap="round"/><rect x="${px(-s.tolerance)}" y="45" width="${Math.max(1,px(s.tolerance)-px(-s.tolerance))}" height="26" rx="4" fill="#b2544322"/><path d="M215 33v48" stroke="#b25443" stroke-width="1.7"/><circle cx="${px(diff)}" cy="58" r="7" fill="#176c59"/><text x="${E.clamp(px(diff),78,352)}" y="23" text-anchor="middle" font-size="14" font-weight="650" fill="#176c59">${sgn(val(diff))} ${U()}</text><text x="40" y="99" font-size="11" fill="#697973">偏高（−）</text><text x="215" y="99" text-anchor="middle" font-size="11" fill="#a14737">目標 0</text><text x="390" y="99" text-anchor="end" font-size="11" fill="#697973">偏低（＋）</text></svg>`;}else $('#manual-zoom').textContent='資料不完整，暫不顯示。';
 s.joints.forEach((j,i)=>{const o=$('#manual-info-'+i);if(o)o.textContent=Number.isFinite(ns[i])?`相對基準圈數 ${nf(j.ref)}：軸向多吃入 ${nf(j.pitch*(ns[i]-j.ref),5)} mm；下垂距離變化 ${sgn(val(E.contribution(j,ns[i])))} ${U()}`:'沒有允許的模擬值';});
}
function renderAll(){
 const oldDetails=$$('details[open]').map(e=>e.id).filter(Boolean);$$('[data-joint-detail][open]').forEach(x=>openJointIds.add(x.dataset.jointDetail));
 calculate();header();renderGoal();renderJoints();renderResult();renderManual();
 for(const id of oldDetails){const el=document.getElementById(id);if(el)el.open=true;}
 setView(s.view,false);persist();
}
function updateField(key,value){
 const textFields=['name','evidence','referenceLabel','zeroLabel'],dimFields=['reference','target','tolerance','uncertainty'];
 if(key.startsWith('j.')){const [,i,k]=key.split('.');const j=s.joints[Number(i)];if(!j)return;j[k]=['name','axis','mode'].includes(k)?value:(value===''?NaN:Number(value));}
 else if(key.startsWith('length.')){const k=key.split('.')[1];s.length[k]=k==='axis'?value:(value===''?NaN:Number(value)*F());}
 else if(dimFields.includes(key))s[key]=value===''?NaN:Number(value)*F();
 else if(key==='checked')s.checked=!!value;
 else if(key==='manualStep')s[key]=Number(value);
 else if(textFields.includes(key))s[key]=String(value).slice(0,2000);
 else s[key]=value;
 if(key==='name'&&s.name&&!s.name.includes('教學案例'))s.isExample=false;
 if(key==='unit'||key.endsWith('.mode')||key==='manualStep'||key==='objective'){renderAll();return;}
 calculate();header();
 if(s.view!=='goal')renderGoal();
 if(s.view!=='joints')renderJoints();
 else {
  s.joints.forEach((j,i)=>{const root=document.querySelector('[data-joint-detail="'+j.id+'"]');if(!root)return;root.querySelector('.joint-title strong').textContent=j.name;root.querySelector('.joint-title small').textContent=axisText(j.axis)+' · '+nf(j.pitch)+' mm／圈 · '+nf(j.min)+'～'+nf(j.max)+' 圈 · '+modeText(j.mode);try{const d=E.domain(j);root.querySelector('.meta').textContent=d.values?(d.values.length?d.values.map(fmtTurn).join('、')+' 圈':'此範圍沒有允許圈數'):'鎖入可以在範圍內連續選擇';}catch(e){root.querySelector('.meta').textContent='請修正數值。';}});
 }
 renderResult(s.view==='result'&&key.startsWith('length.'));renderManual();setView(s.view,false);persist();
}

function help(){openDialog('使用方式與求解界線',`<h3>最短流程</h3><ol><li>在「尺寸」填目標 D*、基準 D₀ 和允許誤差。</li><li>在「接頭」填每圈前進量、基準圈數，以及經確認的允許上下限。</li><li>有方向要求時選「限定朝向」，填某次方向正確的圈數。</li><li>看「結果」；無解時看反推管長。「試轉」可比較圈數與高度的關係。</li></ol><h3>本版確實求解的範圍</h3><p>1～12 個接點、向下／向上／水平的固定軸向、連續圈數、整圈同相位或固定圈數。採區間加總保留離散空隙，並透過單調搜尋最大化各可調接點離上下限的最小比例。不是只把最短和最長連成一整條。</p><p>「範圍內可選」求一組解；「最終圈數不確定」驗證全部允許狀態的最壞上下界。量測／加工不確定量是額外的對稱上界，與圈數範圍分開計入。</p><h3>此版沒有求解的部分</h3><p>任意角度 3D 逆運動學、彎頭實體尺寸與碰撞、水平目標、相互耦合的可旋轉接頭、管件可否按順序裝入、扭矩與密封、灑水分布及消防驗收。多彎頭只適用於走向已知且固定的情況，不能把本版當成完整 3D 配管設計。</p><h3>關於圈數與基準</h3><p>所有圈數是相對清楚記錄的零位；不等於露出牙數或總吃牙數。D₀ 必須與各接頭的 n₀ 同時對應。允許範圍是外部輸入，不由導程自動推斷。導程為每圈前進距離，只有單線螺紋才等於牙距。</p><div class="formula">D = D₀ + q(L − L₀) − Σ cᵢpᵢ(nᵢ − n₀ᵢ)\n\nc：向下 +1 / 向上 −1 / 水平 0\n相位限制：n = 已知同向圈數 + 整數</div><h3>不要把計算解誤當施工指示</h3><p>不得用此工具決定消防設備是否能鬆牙、過度鎖緊或帶壓調整。實際規格、施工與驗收應由負責消防設備的人員按適用文件確認。更換管段／車牙後，零位、允許深度和相位不一定不變，需重新量測。</p><h3>參考來源（需連網才可開啟）</h3><p><a href="https://www.mathworks.com/help/sm/ref/leadscrewjoint.html" target="_blank" rel="noopener">MathWorks：Lead Screw Joint</a> — 螺旋運動的旋轉與軸向位移耦合。</p><p><a href="https://safst.swagelok.com/en/resources/weekly-column/threaded-fitting-assembly" target="_blank" rel="noopener">Swagelok：Threaded Fitting Assembly</a> — 密封受螺紋、材料與安裝等多項因素影響，不存在由本工具推得的通用圈數標準。</p><p><a href="https://ipexna.com/wp-content/uploads/2025/07/flyer-ipex-caen-blazemaster-rapid-seal-adapter.pdf" target="_blank" rel="noopener">IPEX：Rapid Seal Adapter 安裝文件</a> — 該特定產品明示不要靠過鬆或過緊補償深度。其具體施工圈數不能套用到照片中的未知型號。</p><p class="help">資料核對：2026-10-05。核心計算完全離線，無任何網路請求或第三方程式依賴。</p><h3>手機與資料保存</h3><p>手機採底部分頁、大觸控按鈕與單欄顯示。瀏覽器允許時自動暫存；隱私模式或檔案環境可能不允許。重要設定請使用「保存此份 HTML」或 JSON 匯出。iPhone「檔案」中的預覽不一定執行 JavaScript；可改用可執行 HTML 的瀏覽器或靜態網頁部署。</p><button class="btn wide" data-action="self-tests">執行內建計算核心驗算</button>`);}
function report(){
 let out=`灑水頭高度對位 — 幾何試算報告\n${s.name}\n${new Date().toLocaleString('zh-TW')}\n資料：${s.isExample?'教學示例（非現場規格）':s.checked&&s.evidence.trim()?'使用者自行核對':'現場輸入，未核對'}\n來源：${s.evidence||'未提供'}\n對位基準：${s.referenceLabel}\n零位紀錄：${s.zeroLabel}\n\n目標：${unitDim(s.target)} ± ${unitDim(s.tolerance)}\nD₀：${unitDim(s.reference)}\n額外不確定量：± ${unitDim(s.uncertainty)}\n原短管長：${unitDim(s.length.original)}\n試算新長：${unitDim(s.length.trial)}\n更換管段軸向：${axisText(s.length.axis)}\n方式：${s.strategy==='uncertain'?'全部狀態不確定分析':'圈數可選的約束求解'}\n`;
 for(const [i,j] of s.joints.entries())out+=`\n接點 ${i+1} ${j.name}：${j.pitch} mm/圈；n₀=${j.ref}；${j.min}～${j.max} 圈；${axisText(j.axis)}；${modeText(j.mode)}${j.mode==='phase'?`；同向圈數 ${j.phase}`:j.mode==='fixed'?`；固定 ${j.fixed}`:''}`;
 if(currentError)out+=`\n\n未完成判斷：${currentError.message}`;
 else {out+=`\n\n狀態：${({feasible:'幾何上有解',infeasible:'現管長無解',robust:'所有輸入狀態都在目標範圍','not-robust':'不能保證全部狀態達標','domain-empty':'方向／固定值與圈數範圍不相容'})[computed.kind]}`;
 if(computed.intervals.length)out+='\n可達區間：\n'+computed.intervals.map(([a,b])=>`${dim(a)}～${dim(b)} ${U()}`).join('\n');
 if(computed.candidate){out+='\n\n一組裝配座標（不是退牙指令）：\n'+computed.candidate.turns.map((n,i)=>`${i+1}. ${s.joints[i].name}：${fmtTurn(n)} 圈`).join('\n');out+='\n\n'+formulaText(computed.candidate);out+=`\n含額外不確定量後仍在目標範圍：${computed.candidate.guaranteed?'是':'否'}`;}
 if(computed.range)out+=`\n所有狀態含額外不確定量的最壞上下界：${dim(computed.range[0])}～${dim(computed.range[1])} ${U()}`;
 if(advice?.ranges?.length)out+='\n\n未取步距前的可用管長：\n'+advice.ranges.map(([a,b])=>`${dim(a)}～${dim(b)} ${U()}`).join('\n');}
 return out+'\n\n模型界線：固定世界軸向的高度投影；假設更換管段後的接合幾何與相位不變。未處理任意 3D 轉向、水平對位、碰撞、裝配順序、密封、扭矩或消防驗收。允許圈數須有外部依據，不能由照片或牙距推斷。\n\n本報告不是施工或安全核可。';
}
function download(name,contents,mime){const blob=new Blob([contents],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}

function setManual(i,n){
 const j=s.joints[i];if(!Number.isFinite(n))return;
 const d=E.domain(j);if(d.values){if(!d.values.some(v=>Math.abs(v-n)<1e-6)){toast('此圈數不符合方向或固定限制');return;}}
 else if(n<j.min-1e-8||n>j.max+1e-8){toast('模擬圈數必須在允許上下限內');return;}
 j.manual=n;const number=$(`[data-manual="${i}"]`),slider=$(`[data-slider="${i}"]`);if(number&&document.activeElement!==number)number.value=fmtTurn(n);if(slider&&document.activeElement!==slider)slider.value=n;updateManual();persist();
}
document.addEventListener('click',async ev=>{
 const nav=ev.target.closest('[data-view]');if(nav){setView(nav.dataset.view);return;}

 const apply=ev.target.closest('[data-apply-length]');if(apply){s.length.trial=Number(apply.dataset.applyLength);renderAll();toast('已用新管長重新求解；原基準未被覆寫');return;}
 const remove=ev.target.closest('[data-remove]');if(remove){const i=Number(remove.dataset.remove);if(s.joints.length>1){openJointIds.delete(s.joints[i].id);s.joints.splice(i,1);renderAll();}return;}
 const nudge=ev.target.closest('[data-nudge]');if(nudge){const i=Number(nudge.dataset.nudge),j=s.joints[i],n=valuesForManual()[i]+Number(nudge.dataset.sign)*s.manualStep;setManual(i,E.clamp(n,j.min,j.max));return;}
 const ex=ev.target.closest('[data-load-example]');if(ex){s=example(ex.dataset.loadExample);openJointIds.clear();closeDialog();renderAll();setView('result');return;}
 const b=ev.target.closest('[data-action]');if(!b)return;
 const action=b.dataset.action;
 if(action==='help')help();else if(action==='close-dialog')closeDialog();else if(action==='save-menu')saveMenu();else if(action==='save-html')saveHTML();else if(action==='report')showReport();else if(action==='download-report')download(fileName('txt'),report(),'text/plain;charset=utf-8');
 else if(action==='export-json'){try{E.validate(s);download(fileName('json'),JSON.stringify(s,null,2),'application/json;charset=utf-8');}catch(e){toast('請先修正欄位，再匯出專案');}}else if(action==='import-json')$('#import-file').click();
 else if(action==='copy-report'){const text=report();try{await navigator.clipboard.writeText(text);toast('已複製結果');}catch(e){const a=$('#report-text');a.focus();a.select();try{if(!document.execCommand('copy'))throw new Error();toast('已複製結果');}catch(err){toast('請長按文字選取複製，或保存文字檔');}}}
 else if(action==='print'){setView('result');window.print();}else if(action==='use-solution')useSolution();else if(action==='new-project')newProject();
 else if(action==='confirm-new'){s.isExample=false;s.checked=false;s.name='現場高度試算';s.evidence='';closeDialog();renderAll();setView('goal');}
 else if(action==='add-joint'){if(s.joints.length<12){const j=makeJoint('接點 '+(s.joints.length+1));s.joints.push(j);openJointIds.add(j.id);renderAll();$(`[data-joint-detail="${j.id}"]`).scrollIntoView({block:'center',behavior:'smooth'});}}
 else if(action==='length-focus'){$('#length-settings').open=true;$('#length-section').scrollIntoView({block:'start',behavior:'smooth'});}
 else if(action==='reset-length'){s.length.trial=s.length.original;renderAll();toast('已回到原短管長');}
 else if(action==='self-tests'){const results=window.ThreadTests.run();openDialog('計算核心驗算',`<p>${results.filter(t=>t.pass).length} / ${results.length} 項通過。這是模型的數值測試，不是消防施工認證。</p>${results.map(t=>`<div class="testline ${t.pass?'pass':'fail'}">${t.pass?'✓':'✗'} ${esc(t.name)}${t.error?`：${esc(t.error)}`:''}</div>`).join('')}`);}
});
document.addEventListener('change',ev=>{
 const t=ev.target;
 if(t.dataset.field){updateField(t.dataset.field,t.type==='checkbox'?t.checked:t.value);return;}
 if(t.matches('[data-example]')&&t.value){loadExample(t.value);return;}
 if(t.dataset.manual!==undefined){const i=Number(t.dataset.manual);setManual(i,Number(t.value));t.value=fmtTurn(valuesForManual()[i]);return;}
 if(t.id==='tpi'||t.id==='starts'){const tpi=Number($('#tpi').value),starts=Number($('#starts').value);$('#tpi-out').textContent=tpi>0&&starts>0&&Number.isInteger(starts)?`導程 = 25.4 ÷ ${tpi} × ${starts}\n= ${nf(25.4/tpi*starts,6)} mm／圈`:'請輸入正數 TPI 與正整數線數。';}
});
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.slider!==undefined)setManual(Number(t.dataset.slider),Number(t.value));});
document.addEventListener('toggle',ev=>{const d=ev.target;if(d.dataset?.jointDetail){if(d.open)openJointIds.add(d.dataset.jointDetail);else openJointIds.delete(d.dataset.jointDetail);}},true);
$('#dialog').addEventListener('click',ev=>{if(ev.target===$('#dialog'))closeDialog();});
document.addEventListener('keydown',ev=>{if(!$('#dialog').classList.contains('open'))return;if(ev.key==='Escape')closeDialog();if(ev.key==='Tab'){const nodes=[...$('#dialog').querySelectorAll('button,a,input,select,textarea,[tabindex="0"]')].filter(e=>!e.disabled);const first=nodes[0],last=nodes[nodes.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}}});
$('#import-file').addEventListener('change',async ev=>{const file=ev.target.files[0];if(!file)return;try{if(file.size>200000)throw new Error('專案檔超過 200 KB，請確認檔案。');const next=normalize(JSON.parse(await file.text()));next.storageKey='thread-import-'+Date.now();s=next;openJointIds.clear();closeDialog();renderAll();setView('result');toast('已匯入並重新計算');}catch(e){toast('未匯入：'+e.message);}finally{ev.target.value='';}});
window.ThreadApp={getState:()=>JSON.parse(JSON.stringify(s)),getResult:()=>computed,getAdvice:()=>advice,setState:v=>{s=normalize(v);openJointIds.clear();renderAll();},example,report,render:renderAll};
renderAll();document.documentElement.classList.add('ready');$('#app').style.display='block';
})();
</script>
</body></html>
